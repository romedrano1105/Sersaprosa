name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node server and frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Check server syntax
        run: node --check server.js

      - name: Check frontend JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find public/assets/js -type f -name '*.js' -print0)

      - name: Run linter, if configured
        run: npm run lint --if-present

      - name: Run JavaScript tests
        run: npm test

      - name: Build, if configured
        run: npm run build --if-present

  python:
    name: Python API and tests
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile backend modules
        run: python -m compileall -q backend

      - name: Run backend tests
        run: python -m unittest discover -s backend/tests -v

  n8n:
    name: Validate n8n workflow JSON
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate JSON files, if present
        shell: bash
        run: |
          if [ -d n8n ]; then
            find n8n -type f -name '*.json' -print0 |
              while IFS= read -r -d '' file; do
                echo "Validating $file"
                python3 -m json.tool "$file" > /dev/null
              done
          else
            echo "No n8n/ directory; skipping."
          fi

  secrets:
    name: Check for committed Supabase JWTs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Scan tracked files for JWTs
        shell: bash
        run: |
          if git grep -nE 'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.' -- . ':!package-lock.json'; then
            echo "::error::A possible JWT is committed. Move it to a secret environment variable."
            exit 1
          fi
          echo "No Supabase JWTs found in tracked files."
