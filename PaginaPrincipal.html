<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rutas seguras</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#14202b;--panel:#1d2c3a;--line:#2e4153;--tx:#e8eef2;--mut:#93a6b5;--route:#3cc8b4;--high:#e5533d;--mid:#f2b544;--low:#7fb2e5}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 'IBM Plex Sans',system-ui,sans-serif;padding-top:env(safe-area-inset-top,0)}
h1,h2{font-family:'Barlow Semi Condensed',sans-serif;margin:0;font-weight:700}
button,input{font:inherit}
:focus-visible{outline:2px solid var(--route);outline-offset:2px}
.hidden{display:none!important}
/* Login */
#login{min-height:100%;display:grid;place-items:center;padding:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:32px;width:100%;max-width:380px}
.card h1{font-size:34px;line-height:1.1;margin-bottom:6px}
.card p{color:var(--mut);margin:0 0 24px}
label{display:block;margin-bottom:14px;color:var(--mut);font-size:14px}
input{display:block;width:100%;margin-top:4px;padding:11px 12px;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:4px}
.btn{background:var(--route);color:#06241f;border:0;border-radius:4px;padding:11px 16px;font-weight:500;cursor:pointer;width:100%}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line);width:auto;padding:7px 12px}
#err{color:var(--high);min-height:22px;margin:0 0 10px;font-size:14px}
.demo{margin-top:18px;font-size:13px;color:var(--mut)}
/* App */
#app{display:grid;grid-template-rows:auto 1fr;height:100%}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:22px}
header span{color:var(--mut);font-size:14px}
main{display:grid;grid-template-columns:380px 1fr;min-height:0}
aside{overflow:auto;padding:18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px}
#map{min-height:320px;background:#0e1822}
h2{font-size:19px;margin-bottom:8px}
.meta{display:flex;gap:18px;color:var(--mut);font-size:14px;margin-bottom:10px}
.meta b{color:var(--tx);font-weight:500}
ol.stops{margin:0;padding:0;list-style:none;border-left:2px solid var(--route)}
ol.stops li{padding:6px 0 6px 14px;cursor:pointer}
ol.stops li:hover{color:var(--route)}
ol.stops small{display:block;color:var(--mut)}
.inc{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px}
.inc small{color:var(--mut);display:block}
.empty{color:var(--mut)}
.leaflet-container{font-family:inherit}
@media(max-width:820px){main{grid-template-columns:1fr;grid-template-rows:55vh auto}#map{order:-1}aside{border-right:0}}
@media(prefers-reduced-motion:no-preference){.card{animation:in .35s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}}}
</style>
</head>
<body>

<section id="login">
  <form class="card" id="loginForm" autocomplete="on">
    <h1>Rutas seguras</h1>
    <p>Ingresa con tu código de trabajador.</p>
    <label>Código de trabajador<input id="code" required autocomplete="username"></label>
    <label>Contraseña<input id="pass" type="password" required autocomplete="current-password"></label>
    <p id="err" role="alert"></p>
    <button class="btn" id="loginBtn" type="submit">Entrar</button>
    <p class="demo hidden" id="demoNote">Modo demostración: N8N no está configurado, cualquier credencial entra.</p>
  </form>
</section>

<div id="app" class="hidden">
  <header>
    <div><h1>Ruta del día</h1><span id="who"></span></div>
    <button class="btn ghost" id="logout">Salir</button>
  </header>
  <main>
    <aside>
      <section>
        <h2 id="routeTitle">Ruta de hoy</h2>
        <div class="meta"><span>Distancia <b id="mDist">–</b></span><span>Tiempo <b id="mEta">–</b></span><span>Riesgo <b id="mRisk">–</b></span></div>
        <ol class="stops" id="stops"></ol>
        <p class="empty hidden" id="noRoute">Aún no hay ruta asignada para hoy.</p>
      </section>
      <button class="btn" id="gen">Generar ruta aleatoria</button>
      <section>
        <h2>Reportes y siniestros</h2>
        <div id="incList"></div>
      </section>
    </aside>
    <div id="map"></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* =====================================================================
   CONFIGURACIÓN N8N — pega aquí las URLs de tus webhooks.
   Si una URL está vacía, esa parte funciona en modo demostración.

   1) AUTH  (POST)  { code, password }
        → { token, name }                      (401 si son inválidas)
   2) INCIDENTS (POST, Authorization: Bearer <token>)  { bounds:{n,s,e,w} }
        → [{ id, type, severity:"alta"|"media"|"baja", title, source,
             time, lat, lng, radius_m }]       (noticias, policía, tráfico)
   3) ROUTE (POST, Authorization: Bearer <token>)
        { date, seed, avoid:[{lat,lng,radius_m}] }
        → { name, stops:[{name,lat,lng,eta}], path:[[lat,lng],...],
            distance_km, eta_min, risk:"bajo"|"medio"|"alto" }
      Genera la ruta con la IA en N8N usando el seed (cambia cada vez)
      para que no se repita ningún patrón. La validación real de la
      contraseña y del token SIEMPRE debe hacerse en N8N.
   ===================================================================== */
const N8N = { AUTH:"", INCIDENTS:"", ROUTE:"", REFRESH_MS:60000 };
const CENTER = [13.6929,-89.2182]; // San Salvador

const $ = id => document.getElementById(id);
const COLOR = { alta:'#e5533d', media:'#f2b544', baja:'#7fb2e5' };
let session = null, map, layers = {inc:null, route:null}, timer;

function store(k,v){try{v===undefined?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}}
function load(k){try{return sessionStorage.getItem(k)}catch(e){return null}}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}

async function api(url, body){
  const r = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',...(session?{Authorization:'Bearer '+session.token}:{})},body:JSON.stringify(body)});
  if(r.status===401){logout();throw new Error('Sesión vencida');}
  if(!r.ok) throw new Error('Error '+r.status);
  return r.json();
}

/* ---------- Login ---------- */
if(!N8N.AUTH) $('demoNote').classList.remove('hidden');
$('loginForm').addEventListener('submit', async e=>{
  e.preventDefault(); $('err').textContent=''; $('loginBtn').disabled=true;
  try{
    const code=$('code').value.trim(), password=$('pass').value;
    const res = N8N.AUTH ? await api(N8N.AUTH,{code,password}) : {token:'demo',name:'Trabajador '+code};
    if(!res.token) throw new Error('credenciales');
    session={token:res.token,name:res.name||code,code}; store('session',JSON.stringify(session));
    $('pass').value=''; start();
  }catch(err){ $('err').textContent='Código o contraseña incorrectos. Revisa los datos e inténtalo de nuevo.'; }
  $('loginBtn').disabled=false;
});
function logout(){session=null;store('session');clearInterval(timer);$('app').classList.add('hidden');$('login').classList.remove('hidden')}
$('logout').onclick=logout;

/* ---------- App ---------- */
function start(){
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('who').textContent = session.name+' · '+new Date().toLocaleDateString('es-SV',{weekday:'long',day:'numeric',month:'long'});
  if(!map){
    map=L.map('map').setView(CENTER,12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map);
    layers.inc=L.layerGroup().addTo(map); layers.route=L.layerGroup().addTo(map);
  }
  setTimeout(()=>map.invalidateSize(),50);
  refreshIncidents(); clearInterval(timer); timer=setInterval(refreshIncidents,N8N.REFRESH_MS);
  generate(false);
}

let incidents=[];
async function refreshIncidents(){
  try{
    incidents = N8N.INCIDENTS ? await api(N8N.INCIDENTS,{bounds:boundsObj()}) : (incidents.length?incidents:demoIncidents());
  }catch(e){ if(!incidents.length) incidents=[]; }
  drawIncidents();
}
function boundsObj(){const b=map.getBounds();return{n:b.getNorth(),s:b.getSouth(),e:b.getEast(),w:b.getWest()}}
function drawIncidents(){
  layers.inc.clearLayers(); const list=$('incList'); list.replaceChildren();
  if(!incidents.length){list.append(el('p','empty','No hay reportes activos en esta zona.'));return}
  incidents.forEach(i=>{
    const c=COLOR[i.severity]||COLOR.baja;
    const circle=L.circle([i.lat,i.lng],{radius:i.radius_m||300,color:c,fillColor:c,fillOpacity:.25,weight:2}).addTo(layers.inc);
    const pop=el('div'); pop.append(el('b',null,i.title),el('br'),el('span',null,(i.type||'')+' · '+(i.source||'')+' · '+(i.time||''))); circle.bindPopup(pop);
    const row=el('div','inc'); const d=el('span','dot'); d.style.background=c;
    const t=el('div'); t.append(el('div',null,i.title),el('small',null,[i.type,i.source,i.time].filter(Boolean).join(' · ')));
    row.append(d,t); row.onclick=()=>{map.setView([i.lat,i.lng],15);circle.openPopup()}; list.append(row);
  });
}

async function generate(random=true){
  $('gen').disabled=true;
  const seed = random ? crypto.getRandomValues(new Uint32Array(1))[0] : dailySeed();
  const avoid = incidents.filter(i=>i.severity!=='baja').map(i=>({lat:i.lat,lng:i.lng,radius_m:i.radius_m||300}));
  try{
    const r = N8N.ROUTE ? await api(N8N.ROUTE,{date:new Date().toISOString().slice(0,10),seed,avoid}) : demoRoute(seed,avoid);
    drawRoute(r);
  }catch(e){ $('noRoute').classList.remove('hidden'); }
  $('gen').disabled=false;
}
function dailySeed(){return +new Date().toISOString().slice(0,10).replace(/-/g,'')}

function drawRoute(r){
  layers.route.clearLayers(); $('noRoute').classList.add('hidden');
  const ol=$('stops'); ol.replaceChildren();
  $('routeTitle').textContent=r.name||'Ruta de hoy';
  $('mDist').textContent=r.distance_km!=null?r.distance_km+' km':'–';
  $('mEta').textContent=r.eta_min!=null?r.eta_min+' min':'–';
  $('mRisk').textContent=r.risk||'–';
  const line=L.polyline(r.path||r.stops.map(s=>[s.lat,s.lng]),{color:'#3cc8b4',weight:5,opacity:.9}).addTo(layers.route);
  r.stops.forEach((s,k)=>{
    const m=L.marker([s.lat,s.lng]).addTo(layers.route).bindPopup(s.name);
    const li=el('li'); li.append(document.createTextNode((k+1)+'. '+s.name)); if(s.eta) li.append(el('small',null,s.eta));
    li.onclick=()=>{map.setView([s.lat,s.lng],15);m.openPopup()}; ol.append(li);
  });
  map.fitBounds(line.getBounds(),{padding:[40,40]});
}
$('gen').onclick=()=>generate(true);

/* ---------- Datos de demostración (se eliminan al conectar N8N) ---------- */
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function demoIncidents(){return[
 {id:1,type:'Robo',severity:'alta',title:'Asalto a transeúnte',source:'PNC',time:'hace 40 min',lat:13.705,lng:-89.20,radius_m:400},
 {id:2,type:'Tráfico',severity:'media',title:'Accidente y carril cerrado',source:'Tráfico en vivo',time:'hace 15 min',lat:13.69,lng:-89.235,radius_m:350},
 {id:3,type:'Noticia',severity:'baja',title:'Manifestación anunciada',source:'Prensa',time:'hace 2 h',lat:13.675,lng:-89.19,radius_m:300}]}
function dist(a,b){return L.latLng(a).distanceTo(L.latLng(b))}
function demoRoute(seed,avoid){
  const r=rng(seed), pts=[], n=4+Math.floor(r()*2);
  while(pts.length<n){
    const p=[CENTER[0]+(r()-.5)*.1, CENTER[1]+(r()-.5)*.12];
    if(!avoid.some(z=>dist(p,[z.lat,z.lng])<z.radius_m+250)) pts.push(p);
  }
  let km=0; pts.forEach((p,i)=>{if(i)km+=dist(pts[i-1],p)/1000});
  return{name:'Ruta aleatoria '+new Date().toLocaleTimeString('es-SV',{hour:'2-digit',minute:'2-digit'}),
    stops:pts.map((p,i)=>({name:i===0?'Salida':i===n-1?'Llegada':'Punto '+i,lat:p[0],lng:p[1]})),
    distance_km:+km.toFixed(1),eta_min:Math.round(km*3+10),risk:'bajo'};
}

/* Restaura sesión si sigue abierta en esta pestaña */
try{const s=load('session'); if(s){session=JSON.parse(s);start()}}catch(e){}
</script>
</body>
</html>
