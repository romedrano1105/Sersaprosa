<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rutas seguras</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/appNavigation.css">
<style>
:root{--bg:#14202b;--panel:#1d2c3a;--line:#2e4153;--tx:#e8eef2;--mut:#93a6b5;--route:#3cc8b4;--high:#e5533d;--mid:#f2b544;--low:#7fb2e5}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 'IBM Plex Sans',system-ui,sans-serif;padding-top:env(safe-area-inset-top,0)}
h1,h2{font-family:'Barlow Semi Condensed',sans-serif;margin:0;font-weight:700}
button,input{font:inherit}
:focus-visible{outline:2px solid var(--route);outline-offset:2px}
.hidden{display:none!important}
/* Login */
#login{min-height:100%;display:grid;place-items:center;padding:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:32px;width:100%;max-width:380px}
.card h1{font-size:34px;line-height:1.1;margin-bottom:6px}
.card p{color:var(--mut);margin:0 0 24px}
label{display:block;margin-bottom:14px;color:var(--mut);font-size:14px}
input{display:block;width:100%;margin-top:4px;padding:11px 12px;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:4px}
.btn{background:var(--route);color:#06241f;border:0;border-radius:4px;padding:11px 16px;font-weight:500;cursor:pointer;width:100%}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line);width:auto;padding:7px 12px}
#err{color:var(--high);min-height:22px;margin:0 0 10px;font-size:14px}
.demo{margin-top:18px;font-size:13px;color:var(--mut)}
/* App */
#app{display:grid;grid-template-rows:auto 1fr;height:100%}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:22px}
header span{color:var(--mut);font-size:14px}
main{display:grid;grid-template-columns:380px 1fr;min-height:0}
aside{overflow:auto;padding:18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px}
#map{min-height:320px;background:#0e1822}
h2{font-size:19px;margin-bottom:8px}
.meta{display:flex;gap:18px;color:var(--mut);font-size:14px;margin-bottom:10px}
.meta b{color:var(--tx);font-weight:500}
ol.stops{margin:0;padding:0;list-style:none;border-left:2px solid var(--route)}
ol.stops li{padding:6px 0 6px 14px;cursor:pointer}
ol.stops li:hover{color:var(--route)}
ol.stops small{display:block;color:var(--mut)}
.inc{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px}
.inc small{color:var(--mut);display:block}
.empty{color:var(--mut)}
.panel-tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);padding-bottom:10px}
.panel-tabs button{background:transparent;color:var(--tx);border:1px solid var(--line);border-radius:4px;padding:7px 12px;cursor:pointer}
.panel-tabs button[aria-selected="true"]{border-color:var(--route);color:var(--route)}
.route-option{display:block;width:100%;text-align:left;background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:4px;padding:10px;margin:8px 0;cursor:pointer}
.route-option[aria-pressed="true"]{border-color:var(--route);box-shadow:inset 3px 0 var(--route)}
.route-option small{display:block;color:var(--mut)}
.route-stop-icon{background:transparent;border:0}
.route-stop-marker{display:grid;width:28px;height:28px;place-items:center;border:2px solid #fff;border-radius:50%;background:var(--route);box-shadow:0 1px 5px #0009;color:#06241f;font-weight:700}
.event-filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.event-filters label{margin:0;font-size:12px}.event-filters select,.event-filters input{padding:7px;font-size:13px}
.event-item{padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.event-item small{display:block;color:var(--mut)}
.notice{border-left:3px solid var(--mid);padding:8px 10px;color:var(--mut);font-size:13px}
#routeOptions,#eventsList{max-height:35vh;overflow:auto}
.leaflet-container{font-family:inherit}
@media(max-width:820px){main{grid-template-columns:1fr;grid-template-rows:55vh auto}#map{order:-1}aside{border-right:0}}
@media(prefers-reduced-motion:no-preference){.card{animation:in .35s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}}}
</style>
</head>
<body>

<section id="login">
  <form class="card" id="loginForm" autocomplete="on">
    <h1>Rutas seguras</h1>
    <p>Ingresa con tu código de trabajador.</p>
    <label>Código de trabajador<input id="code" required autocomplete="username"></label>
    <label>Contraseña<input id="pass" type="password" required autocomplete="current-password"></label>
    <p id="err" role="alert"></p>
    <button class="btn" id="loginBtn" type="submit">Entrar</button>
  </form>
</section>

<div id="app" class="hidden">
  <header>
    <div><h1>Ruta del día</h1><span id="who"></span></div>
  </header>
  <main>
    <aside>
      <nav class="panel-tabs" aria-label="Panel del mapa">
        <button type="button" data-panel="routes" aria-selected="true">Rutas</button>
        <button type="button" data-panel="events" aria-selected="false">Eventos</button>
      </nav>
      <section id="routesPanel">
        <h2 id="routeTitle">Ruta del día</h2>
        <div class="meta"><span>Distancia <b id="mDist">–</b></span><span>Tiempo <b id="mEta">–</b></span><span>Riesgo <b id="mRisk">–</b></span></div>
        <p id="routeMessage" class="notice hidden" role="status"></p>
        <ol class="stops" id="stops"></ol>
        <p class="empty hidden" id="noRoute" role="alert">No fue posible calcular la ruta por calles. Revisa tu conexión e inténtalo de nuevo.</p>
        <h2>Opciones de ruta</h2>
        <div id="routeOptions" aria-live="polite"></div>
        <button class="btn" id="gen" type="button">Generar ruta aleatoria</button>
      </section>
      <section id="eventsPanel" class="hidden">
        <h2>Eventos e incidentes cercanos</h2>
        <div class="event-filters">
          <label>Severidad<select id="eventSeverity"><option value="">Todas</option><option value="alta">Alta</option><option value="media">Media</option><option value="baja">Baja</option></select></label>
          <label>Desde<input id="eventFrom" type="date"></label>
          <label>Hasta<input id="eventTo" type="date"></label>
        </div>
        <p id="eventsMessage" class="notice hidden" role="status"></p>
        <div id="eventsList" aria-live="polite"></div>
      </section>
    </aside>
    <div id="map"></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/assets/js/appNavigation.js"></script>
<script src="/assets/js/dashboard.js"></script>
</body>
</html>
